version: "3.9"

services:
  frontend:
    build:
      context: ./rag-ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./rag-backend
    ports:
      - "8000:8000"
    volumes:
      - ./rag-backend:/app
    depends_on:
      - chroma
      - ollama
    environment:
      - CHROMA_DB=http://chroma:8000
      - OLLAMA_BASE_URL=http://ollama:11434
    env_file:
      - .env
    restart: always

  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/.chroma
    restart: always

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always
    entrypoint: >
      sh -c "
        ollama serve & 
        sleep 5 && 
        ollama pull llama3.2:latest && 
        ollama pull bge-m3:latest && 
        tail -f /dev/null
      "

volumes:
  chroma_data:
  ollama_data:
