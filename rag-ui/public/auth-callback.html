<!DOCTYPE html>
<html>
<head>
    <title>Auth Callback</title>
</head>
<body>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');
        
        if (window.opener) {
            window.opener.postMessage({
                type: 'GOOGLE_AUTH',
                code: code,
                error: error
            }, window.location.origin);
            window.close();
        }
    </script>
</body>
</html>
